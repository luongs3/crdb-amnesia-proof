server {
    listen 80;
    listen [::]:80;
    server_name amnesia.theodoikenh.com;

    # Certbot will inject the TLS server block and the 80->443 redirect.

    access_log /var/log/nginx/amnesia.access.log;
    error_log  /var/log/nginx/amnesia.error.log;

    location / {
        proxy_pass http://127.0.0.1:8805;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The dashboard is driven by Server-Sent Events. Without these three settings nginx
    # buffers the stream and the live cluster/memory panels never update -- which would
    # silently break the one thing the demo is meant to show.
    location /events {
        proxy_pass http://127.0.0.1:8805/events;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }
}
